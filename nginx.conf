events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    upstream backend {
        server backend:3001;
    }

    upstream ai_chat {
        server ai-chat-service:8001;
    }

    upstream news {
        server news-service:8002;
    }

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Backend API proxy — keep full /api/ path (backend expects it)
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_read_timeout 30s;
        }

        # AI Chat microservice — strip /ai-chat prefix
        location /ai-chat/ {
            proxy_pass http://ai_chat/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }

        # News microservice — strip /news-api prefix
        location /news-api/ {
            proxy_pass http://news/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

        # React SPA — client-side routing support
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
