version: "3.9"

services:
  ai-chat:
    build: .
    container_name: ai-chat-service
    ports:
      - "8001:8001"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - AI_CHAT_HOST=0.0.0.0
      - AI_CHAT_PORT=8001
      - DEBUG=false
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080
    restart: unless-stopped
